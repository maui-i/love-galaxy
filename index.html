<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Galaxy for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* One deliberate dark look: a pink galaxy at night, the same in every theme */
    :root {
      --bg: #050005;
      --text: #ffe3ef;
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: none;
    }
    .title {
      position: fixed;
      top: calc(3vh + env(safe-area-inset-top, 0px));
      left: 0;
      right: 0;
      margin: 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      z-index: 1;
      text-align: center;
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.8rem, 6vw, 3.4rem);
      text-shadow: 0 0 18px rgb(255 80 160 / 0.7);
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.5s ease;
    }
    .title.show { opacity: 1; }

    /* ===== Start screen: an 8-bit heart is the start button ===== */
    :root {
      --px-pink: #ff3d8b;
      --px-shine: #ffd6e8;
      --px-shade: #c2185b;
      --px-outline: #8a1048;
      --px-font: "Press Start 2P", ui-monospace, Menlo, monospace;
    }
    .start {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: rgb(5 0 5 / 0.62);
      transition: opacity 0.9s ease;
      cursor: pointer; /* the whole screen starts it */
      -webkit-tap-highlight-color: transparent;
    }
    .start.gone {
      opacity: 0;
      pointer-events: none;
    }
    .start-btn {
      display: grid;
      justify-items: center;
      gap: 32px;
      padding: 16px;
      border: 0;
      background: none;
      color: var(--text);
      font-family: var(--px-font);
      font-size: clamp(0.75rem, 3vw, 1rem);
      letter-spacing: 0.12em;
      cursor: pointer;
    }
    .start-btn:focus-visible {
      outline: 3px dashed var(--px-pink);
      outline-offset: 10px;
    }
    /* Three wrappers so float, pulse and pop each own their transform */
    .heart-float { animation: float 2.4s steps(8) infinite alternate; }
    .heart-px {
      display: block;
      width: min(46vw, 200px);
      animation: pulse 1.4s steps(1) infinite;
      filter: drop-shadow(0 0 18px rgb(255 61 139 / 0.6));
      transition: filter 0.2s;
    }
    .heart-px svg { display: block; width: 100%; height: auto; }
    .heart-px .o { fill: var(--px-outline); }
    .heart-px .p { fill: var(--px-pink); }
    .heart-px .s { fill: var(--px-shade); }
    .heart-px .w { fill: var(--px-shine); }
    .start-btn:hover .heart-px,
    .start-btn:focus-visible .heart-px { filter: drop-shadow(0 0 28px rgb(255 61 139 / 0.95)) brightness(1.15); }
    .press { animation: blink 1s steps(1) infinite; }
    .start-btn.pressed .heart-px { animation: pop 0.5s steps(5) forwards; }
    .start-btn.pressed .press { animation: none; opacity: 0; }

    @keyframes float { from { transform: translateY(8px); } to { transform: translateY(-14px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.08); } 30% { transform: scale(1); } 42% { transform: scale(1.05); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pop { to { transform: scale(1.8); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .heart-float, .heart-px, .press { animation: none; }
      .start-btn.pressed .heart-px { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>
  <p class="title"></p>
  <div class="start" id="start">
    <button class="start-btn" id="start-btn" type="button" aria-label="Start">
      <span class="heart-float"><span class="heart-px" id="heart-px"></span></span>
      <span class="press">PRESS START</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // ===== Change these =====
    const CONFIG = {
      title: "for you",
      // Words that float around the galaxy
      words: ["I love you"],
    };

    const COLORS = {
      background: 0x050005,
      galaxyInside: "#ff6fb0",
      galaxyOutside: "#6a0f45",
      ring: "#ffd1e6",
      heart: "#ff3d8b",
      heartEdge: "#ffa3cc",
    };

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Detail level: computers get the most particles, phones a bit fewer so they stay smooth.
    // Raise these to add more particles; smaller dots (DOT_SCALE) make it look finer.
    const isPhone = window.matchMedia("(pointer: coarse)").matches;
    const DETAIL = isPhone ? 1.6 : 3;
    const DOT_SCALE = isPhone ? 0.85 : 0.7;
    const many = (n) => Math.round(n * DETAIL);
    const TAU = Math.PI * 2;

    // ===== Scene, camera, controls =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3)); // full sharpness on Retina and phone screens
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(COLORS.background);
    scene.fog = new THREE.FogExp2(COLORS.background, 0.01);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
    const START = new THREE.Vector3(0, 70, 110);
    // Phones are tall and narrow, so stand back a bit further there
    const END = innerWidth < innerHeight ? new THREE.Vector3(0, 20, 52) : new THREE.Vector3(0, 15, 44);
    camera.position.copy(reduceMotion ? END : START);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 7.5, 0);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 12;
    controls.maxDistance = 90;
    controls.autoRotate = !reduceMotion;
    controls.autoRotateSpeed = 0.35;
    controls.enabled = reduceMotion; // turned on after the fly-in

    // ===== Helpers =====
    // Soft round dot used for every particle
    function dotTexture() {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, "rgba(255,255,255,1)");
      grad.addColorStop(0.35, "rgba(255,255,255,0.6)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const DOT = dotTexture();

    function makePoints(positions, colors, size, opacity = 1) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size,
        map: DOT,
        vertexColors: true,
        transparent: true,
        opacity,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      return new THREE.Points(geo, mat);
    }

    // Glowing text drawn onto a canvas, shown as a sprite that always faces the camera
    function textSprite(text, height) {
      const c = document.createElement("canvas");
      const g = c.getContext("2d");
      const font = "600 128px 'Cormorant Garamond', Georgia, serif";
      g.font = font;
      c.width = Math.ceil(g.measureText(text).width) + 120;
      c.height = 220;
      g.font = font;
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.shadowColor = "rgba(255, 70, 150, 0.95)";
      g.shadowBlur = 44;
      g.fillStyle = "#ffe3ef";
      g.fillText(text, c.width / 2, c.height / 2);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set((height * c.width) / c.height, height, 1);
      return sprite;
    }

    function emojiSprite(emoji, size) {
      const c = document.createElement("canvas");
      c.width = c.height = 256;
      const g = c.getContext("2d");
      g.font = "200px serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(emoji, 128, 140);
      const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, opacity: 0 });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(size, size, 1);
      return sprite;
    }

    // ===== Moving particles, computed on the graphics card =====
    // Shared by every moving particle system, so one update per frame moves them all
    const shared = {
      uTime: { value: 0 },
      uScale: { value: innerHeight / 2 },
      uPixelRatio: { value: renderer.getPixelRatio() },
    };
    const POINT_FRAG = `
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float a = pow(clamp(1.0 - d, 0.0, 1.0), 1.6);
        gl_FragColor = vec4(vColor, a * vAlpha);
      }`;
    const POINT_SIZE = `
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = uSize * uPixelRatio * uScale / -mv.z;
      gl_Position = projectionMatrix * mv;`;

    function pointsMaterial(vertexShader, uniforms) {
      return new THREE.ShaderMaterial({
        uniforms: { ...shared, ...uniforms },
        vertexShader,
        fragmentShader: POINT_FRAG,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
    }

    // Gas spiraling into the black hole. Each particle falls from the outer edge to the hole,
    // orbiting faster the closer it gets, then starts again at the edge.
    const SWIRL_VERT = `
      uniform float uTime, uScale, uPixelRatio, uSize;
      uniform float uRin, uRout, uInflow, uWind, uSpread, uThick, uSpin, uBeam;
      uniform vec3 uOuter, uInner, uHot;
      attribute vec4 aRand;
      attribute float aWhite;
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        // p goes from 0 at the outer edge to 1 at the hole
        float p = fract(aRand.x + uTime * uInflow);
        float r = uRin + (uRout - uRin) * pow(1.0 - p, 1.4);
        // The angle keeps growing as it falls, so the inside spins faster and the arms stay spiral
        float ang = aRand.y + uWind * log(uRout / r) + uTime * uSpin;
        vec3 pos = vec3(cos(ang) * r, 0.0, sin(ang) * r);
        pos.xz += aRand.zw * uSpread * r;
        pos.y = (aRand.z + aRand.w) * uThick * (1.0 + 0.05 * r);

        float heat = 1.0 - smoothstep(uRin, uRout, r); // 1 at the hole, 0 at the edge
        vec3 col = mix(uOuter, uInner, smoothstep(0.0, 0.7, heat));
        col = mix(col, uHot, smoothstep(0.7, 1.0, heat));
        col = mix(col, vec3(1.0), aWhite);
        // Doppler beaming: gas moving toward the camera looks brighter
        vec3 dir = vec3(-sin(ang), 0.0, cos(ang));
        float toward = normalize((modelViewMatrix * vec4(dir, 0.0)).xyz).z;
        vColor = col * (1.0 + uBeam * toward * heat) * (0.75 + 0.5 * heat);
        // Fade in at the edge, vanish into the hole
        vAlpha = smoothstep(0.0, 0.05, p) * (1.0 - smoothstep(0.95, 1.0, p));
        ${POINT_SIZE}
      }`;

    function makeSwirl(o) {
      const n = many(o.count);
      const rand = new Float32Array(n * 4), white = new Float32Array(n);
      const jitter = () => Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? -1 : 1);
      for (let i = 0; i < n; i++) {
        rand[i * 4] = Math.random();
        rand[i * 4 + 1] = o.arms ? ((i % o.arms) / o.arms) * TAU : Math.random() * TAU;
        rand[i * 4 + 2] = jitter();
        rand[i * 4 + 3] = jitter();
        white[i] = Math.random() < o.white ? 1 : 0;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
      geo.setAttribute("aRand", new THREE.BufferAttribute(rand, 4));
      geo.setAttribute("aWhite", new THREE.BufferAttribute(white, 1));
      const points = new THREE.Points(geo, pointsMaterial(SWIRL_VERT, {
        uSize: { value: o.size * DOT_SCALE },
        uRin: { value: o.rin },
        uRout: { value: o.rout },
        uInflow: { value: o.inflow },
        uWind: { value: o.wind },
        uSpread: { value: o.spread },
        uThick: { value: o.thick },
        uSpin: { value: o.spin },
        uBeam: { value: o.beam },
        uOuter: { value: new THREE.Color(o.outer) },
        uInner: { value: new THREE.Color(o.inner) },
        uHot: { value: new THREE.Color(o.hot) },
      }));
      points.frustumCulled = false; // positions are worked out on the graphics card
      return points;
    }

    // ===== Galaxy: three spiral arms slowly draining into the center =====
    const galaxy = makeSwirl({
      count: 45000, arms: 3, rin: 2.3, rout: 34,
      inflow: 1 / 150, // one trip from the edge to the hole takes about 2.5 minutes
      wind: 2.6, spread: 0.4, thick: 0.35, spin: 0.01, beam: 0.6,
      outer: COLORS.galaxyOutside, inner: COLORS.galaxyInside, hot: COLORS.ring,
      white: 0.07, size: 0.22,
    });
    scene.add(galaxy);

    // Background stars
    {
      const pos = [], col = [];
      for (let i = 0; i < many(4000); i++) {
        const v = new THREE.Vector3().randomDirection().multiplyScalar(120 + Math.random() * 150);
        pos.push(v.x, v.y, v.z);
        const b = 0.5 + Math.random() * 0.5;
        col.push(b, b * 0.85, b * 0.95);
      }
      scene.add(makePoints(pos, col, 0.9, 0.8));
    }

    // ===== Black hole =====
    const HOLE_Y = 0.4;
    const hole = new THREE.Mesh(new THREE.SphereGeometry(2, 64, 64), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    hole.position.y = HOLE_Y;
    scene.add(hole);

    // Accretion disk: hot, fast gas just outside the hole
    const disk = makeSwirl({
      count: 12000, arms: 0, rin: 2.1, rout: 8,
      inflow: 1 / 18, wind: 3.5, spread: 0.06, thick: 0.06, spin: 0.15, beam: 0.9,
      outer: COLORS.galaxyInside, inner: "#ff9ccc", hot: "#fff2f7",
      white: 0.1, size: 0.2,
    });
    disk.position.y = HOLE_Y;
    scene.add(disk);

    // Photon ring: light bent all the way around the hole, so it always faces you
    const photonRing = new THREE.Group();
    photonRing.position.y = HOLE_Y;
    scene.add(photonRing);
    {
      const ringPoints = makeSwirl({
        count: 9000, arms: 0, rin: 2.1, rout: 3.3,
        inflow: 1 / 60, wind: 1, spread: 0.03, thick: 0, spin: 0.5, beam: 0.8,
        outer: "#ff8cc4", inner: "#ffd6e8", hot: "#ffffff",
        white: 0.2, size: 0.26,
      });
      ringPoints.rotation.x = Math.PI / 2; // lay the ring in the plane facing the camera
      photonRing.add(ringPoints);
    }

    // Pink glow behind everything in the middle
    {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, "rgba(255, 90, 170, 0.55)");
      grad.addColorStop(1, "rgba(255, 90, 170, 0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 128, 128);
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false }));
      glow.scale.set(22, 22, 1);
      glow.position.y = HOLE_Y;
      scene.add(glow);
    }

    // ===== Heart made of shimmering particles =====
    const HEART_Y = 17, HEART_SIZE = 6;
    const heart = new THREE.Group();
    heart.position.y = HEART_Y;
    scene.add(heart);
    {
      const pos = [], col = [], seeds = [];
      const body = new THREE.Color(COLORS.heart), edge = new THREE.Color(COLORS.heartEdge);
      // A 3D heart surface: points where f <= 0 are inside
      const f = (x, y, z) => Math.pow(x * x + 2.25 * z * z + y * y - 1, 3) - x * x * y * y * y - 0.1125 * z * z * y * y * y;
      const total = many(16000);
      while (seeds.length < total) {
        const x = (Math.random() - 0.5) * 2.6, y = (Math.random() - 0.5) * 2.6, z = (Math.random() - 0.5) * 2;
        const v = f(x, y, z);
        if (v > 0) continue;
        const nearEdge = v > -0.04;
        if (!nearEdge && Math.random() > 0.35) continue; // keep the inside lighter so the outline glows
        pos.push(x * HEART_SIZE, y * HEART_SIZE, z * HEART_SIZE);
        const c = nearEdge ? edge.clone().lerp(body, Math.random() * 0.6) : body;
        col.push(c.r, c.g, c.b);
        seeds.push(Math.random());
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute("aColor", new THREE.Float32BufferAttribute(col, 3));
      geo.setAttribute("aSeed", new THREE.Float32BufferAttribute(seeds, 1));
      heart.add(new THREE.Points(geo, pointsMaterial(`
        uniform float uTime, uScale, uPixelRatio, uSize;
        attribute vec3 aColor;
        attribute float aSeed;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          // Each particle drifts a little and twinkles on its own rhythm
          vec3 drift = vec3(
            sin(uTime * 1.1 + aSeed * 31.0),
            sin(uTime * 0.9 + aSeed * 17.0),
            sin(uTime * 1.3 + aSeed * 7.0)) * 0.12;
          vec3 pos = position + drift;
          vColor = aColor;
          vAlpha = 0.7 + 0.3 * sin(uTime * 2.5 + aSeed * 60.0);
          ${POINT_SIZE}
        }`, { uSize: { value: 0.2 * DOT_SCALE } })));
    }

    // ===== Funnel of light rising from the black hole into the heart =====
    const streamMat = (() => {
      const n = many(3500);
      const rand = new Float32Array(n * 4);
      for (let i = 0; i < n; i++) {
        rand[i * 4] = Math.random();
        rand[i * 4 + 1] = Math.random() * TAU;
        rand[i * 4 + 2] = Math.random();
        rand[i * 4 + 3] = Math.random();
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
      geo.setAttribute("aRand", new THREE.BufferAttribute(rand, 4));
      const mat = pointsMaterial(`
        uniform float uTime, uScale, uPixelRatio, uSize, uBottom, uTop;
        uniform vec3 uFrom, uTo;
        attribute vec4 aRand;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          // Each particle rises at its own speed
          float p = fract(aRand.x + uTime * (0.06 + 0.07 * aRand.w));
          float y = mix(uBottom, uTop, p);
          // Wide and lazy where it leaves the disk, tight and fast near the heart
          float r = 0.1 + 3.0 * pow(1.0 - p, 2.4);
          r += sin(uTime * 1.7 + aRand.z * 40.0 + p * 9.0) * 0.3 * (1.0 - p);
          float ang = aRand.y + 12.0 * p + uTime * 0.8;
          vec3 pos = vec3(cos(ang) * r, y, sin(ang) * r);
          // The whole column sways gently, most in the middle
          float bend = sin(p * 3.14159);
          pos.x += sin(uTime * 0.45) * 0.6 * bend;
          pos.z += cos(uTime * 0.37) * 0.4 * bend;
          vColor = mix(uFrom, uTo, p);
          vAlpha = smoothstep(0.0, 0.1, p) * (1.0 - smoothstep(0.9, 1.0, p)) * (0.6 + 0.4 * aRand.w);
          ${POINT_SIZE}
        }`, {
        uSize: { value: 0.17 * DOT_SCALE },
        uBottom: { value: HOLE_Y + 0.4 },
        uTop: { value: HEART_Y - HEART_SIZE },
        uFrom: { value: new THREE.Color(COLORS.ring) },
        uTo: { value: new THREE.Color(COLORS.heart) },
      });
      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      scene.add(points);
      return mat;
    })();

    // ===== Words and little hearts orbiting the black hole =====
    // Closer ones orbit faster, like everything else around it
    const floaters = [];
    function addFloater(sprite, r, angle, y, phase) {
      scene.add(sprite);
      floaters.push({ sprite, r, angle, y, phase, speed: 0.55 / Math.pow(r, 0.9) });
    }
    // Fill at least 6 spots around the galaxy, repeating the words if there are fewer
    const SPOTS = Math.max(6, CONFIG.words.length);
    const placed = Array.from({ length: SPOTS }, (_, i) => CONFIG.words[i % CONFIG.words.length]);
    // Wait for the font so the words don't draw in a fallback font
    document.fonts.load("600 128px 'Cormorant Garamond'").catch(() => {}).then(() => placed.forEach((word, i) => {
      addFloater(textSprite(word, 2.1), 11 + (i % 3) * 5, (i / SPOTS) * TAU, 1.2 + (i % 2) * 1.5, i * 1.3);
    }));
    ["💗", "💖", "💕", "💞", "💗", "💓"].forEach((emoji, i) => {
      addFloater(emojiSprite(emoji, 2.2), 9 + (i % 3) * 7, (i / 6) * TAU + 0.5, 3 + (i % 2) * 2, i * 2.1);
    });

    // ===== Title =====
    const title = document.querySelector(".title");
    title.textContent = CONFIG.title;

    // ===== Start screen =====
    // The 8-bit heart, one character per pixel
    const HEART_PIXELS = [
      "..##...##..",
      ".####.####.",
      "###########",
      "###########",
      "###########",
      ".#########.",
      "..#######..",
      "...#####...",
      "....###....",
      ".....#.....",
    ];
    function pixelHeart() {
      const w = HEART_PIXELS[0].length + 2, h = HEART_PIXELS.length + 2;
      const on = (x, y) => HEART_PIXELS[y - 1]?.[x - 1] === "#";
      let rects = "";
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let cls = null;
          if (on(x, y)) {
            const shine = (y === 2 && (x === 3 || x === 4)) || (y === 3 && x === 2);
            const shade = y >= 8 || (x >= w - 3 && y >= 4);
            cls = shine ? "w" : shade ? "s" : "p";
          } else if (on(x + 1, y) || on(x - 1, y) || on(x, y + 1) || on(x, y - 1)) {
            cls = "o"; // outline around the heart
          }
          if (cls) rects += `<rect class="${cls}" x="${x}" y="${y}" width="1.02" height="1.02"/>`;
        }
      }
      return `<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
    }
    document.getElementById("heart-px").innerHTML = pixelHeart();

    let startedAt = null; // when the start button was pressed
    const startScreen = document.getElementById("start");
    const startBtn = document.getElementById("start-btn");
    function start() {
      if (startedAt !== null) return;
      startedAt = clock.elapsedTime;
      startBtn.classList.add("pressed");
      setTimeout(() => startScreen.classList.add("gone"), 300);
    }
    // A click or tap anywhere on the start screen starts it, not just on the heart
    startScreen.addEventListener("click", start);
    // Any key works too (Enter and Space already press the focused button)
    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") start();
    });
    startBtn.focus({ preventScroll: true });

    // ===== Animation =====
    const FLY_IN = 5; // seconds for the camera to swoop in
    const clock = new THREE.Clock();
    let simTime = 0; // animation time, slowed down for people who prefer less motion
    const easeInOut = (v) => (v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2);

    // Heartbeat: two quick bumps, then a rest
    function beat(t) {
      const p = (t % 1.4) / 1.4;
      return Math.exp(-Math.pow((p - 0.1) / 0.05, 2)) + 0.6 * Math.exp(-Math.pow((p - 0.28) / 0.05, 2));
    }

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      const speed = reduceMotion ? 0.3 : 1;

      simTime += dt * speed;
      shared.uTime.value = simTime;
      heart.rotation.y = Math.sin(simTime * 0.4) * 0.35;
      heart.scale.setScalar(1 + (reduceMotion ? 0 : 0.07 * beat(t)));
      heart.position.y = HEART_Y + Math.sin(simTime * 0.6) * 0.35; // gentle float
      streamMat.uniforms.uTop.value = heart.position.y - HEART_SIZE * heart.scale.y;

      // Seconds since the start button was pressed; the galaxy idles behind the start screen until then
      const since = startedAt === null ? 0 : t - startedAt;
      const fade = Math.min(1, Math.max(0, (since - 2) / 2));
      for (const f of floaters) {
        f.angle += f.speed * dt * speed;
        f.sprite.position.set(Math.cos(f.angle) * f.r, f.y + Math.sin(t * 0.8 + f.phase) * 0.4, Math.sin(f.angle) * f.r);
        f.sprite.material.opacity = fade;
      }
      if (since > 3) title.classList.add("show");

      if (!controls.enabled) {
        // Fly-in: swoop from far above down to the viewing spot
        const p = easeInOut(Math.min(1, since / FLY_IN));
        camera.position.lerpVectors(START, END, p);
        camera.lookAt(controls.target);
        if (p >= 1) controls.enabled = true;
      } else {
        controls.update();
      }

      photonRing.quaternion.copy(camera.quaternion);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      shared.uScale.value = innerHeight / 2;
    });
  </script>
</body>
</html>
